  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOOuIvyEriDGNmKPb4Jy25yB_lE1gBAZk",
      databaseURL: "https://tournoi-defis-tt-default-rtdb.firebaseio.com",
      projectId: "tournoi-defis-tt"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role') || 'prof';
    const tableId = urlParams.get('id') || '1';
    const studentQRId = urlParams.get('student') || null;

    let currentGroup = localStorage.getItem('eps_current_group') || 'Classe_1';

    // Sécurisation XSS
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // DÉTERMINATION DU NIVEAU DE JEU (1 À 5) D'APRÈS LA NOTE DÉCIMALE OBTENUE
    function getLevelFromNote(grade, score) {
      if (score === null || score === undefined || score === "") return 0;
      const val = parseFloat(score);
      if (grade === '6eme') {
        if (val <= 4) return 1;
        if (val <= 8) return 2;
        if (val <= 10) return 3;
        if (val <= 11) return 4;
        return 5;
      }
      if (grade === '5eme') {
        if (val <= 2) return 1;
        if (val <= 6) return 2;
        if (val <= 10) return 3;
        if (val <= 11) return 4;
        return 5;
      }
      if (grade === '4eme') {
        if (val <= 1) return 1;
        if (val <= 5) return 2;
        if (val <= 8) return 3;
        if (val <= 11) return 4;
        return 5;
      }
      if (grade === '3eme') {
        if (val <= 1) return 1;
        if (val <= 4) return 2;
        if (val <= 7) return 3;
        if (val <= 10) return 4;
        return 5;
      }
      return 1;
    }

    const LEVEL_DESCRIPTIONS = {
      0: { name: "Non évalué", class: "lvl-1", service: "-", deplacements: "-", actions: "-", tactique: "-" },
      1: { name: "1. DÉBUTANT", class: "lvl-1", service: "Non réglementaire", deplacements: "Statique", actions: "Piston, mauvaise prise", tactique: "Renvoi simple" },
      2: { name: "2. APPRENTI", class: "lvl-2", service: "Réglementaire sans intention", deplacements: "1 pas sans replacement", actions: "Coup préférentiel", tactique: "Cherche la continuité" },
      3: { name: "3. DÉBROUILLÉ", class: "lvl-3", service: "Simple / stéréotypé", deplacements: "Déplacement latéral", actions: "CD / Revers placé", tactique: "Rupture sur balle facile" },
      4: { name: "4. CONFIRMÉ", class: "lvl-4", service: "Placé, canon, intention", deplacements: "Latéral + profondeur", actions: "Frappe, place, smash", tactique: "Finit sur coup fort" },
      5: { name: "5. EXPERT", class: "lvl-5", service: "Canon / Effet coupé", deplacements: "Replacement systématique", actions: "Variation, effets", tactique: "Construit dès le service" }
    };

    function getPouleNote6(place, victoires) {
      if (place === 1) {
        if (victoires >= 3) return 6;
        if (victoires === 2) return 5;
        return 4;
      }
      if (place === 2) {
        if (victoires >= 2) return 4;
        return 3;
      }
      if (place === 3) {
        if (victoires >= 1) return 3;
        return 2;
      }
      return 2;
    }

    const DEFAULT_QUESTS = [
      { id: 'q1', text: '🎯 Bat un joueur mieux classé que toi', bonus: 3 },
      { id: 'q2', text: '🛡️ Enchaîne 2 victoires consécutives', bonus: 3 },
      { id: 'q3', text: '🏓 Arbitre au moins 2 matchs', bonus: 3 },
      { id: 'q4', text: '⚡ Réalise un défi contre un adversaire inédit', bonus: 2 }
    ];

    function getGroupPath(subpath) {
      return `groups/${currentGroup}/${subpath}`;
    }

    function showToast(message, type = 'success') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.className = 'toast';
      if (type === 'danger') {
        toast.style.background = '#ef4444';
        toast.style.color = '#ffffff';
      } else if (type === 'warning') {
        toast.style.background = '#f59e0b';
        toast.style.color = '#271a00';
      }
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3200);
    }

    // Gestion AudioContext Singleton pour iOS Safari
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playVictorySound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;

          const start = now + idx * 0.1;
          const end = start + 0.25;

          gain.gain.setValueAtTime(0.15, start);
          gain.gain.exponentialRampToValueAtTime(0.001, end);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(start);
          osc.stop(end);
        });
      } catch (e) {
        console.log("Audio non pris en charge", e);
      }
    }

    // Calcul précis conforme au tableau barème EPS officiel
    function calculatePointsDelta(pWinner, pLoser, isFlash = false) {
      const diffWinner = pWinner - pLoser; // > 0 si le vainqueur était favori
      let vGain = 6;

      if (diffWinner >= 10) vGain = 2;
      else if (diffWinner >= 8) vGain = 3;
      else if (diffWinner >= 6) vGain = 4;
      else if (diffWinner >= 4) vGain = 5;
      else if (diffWinner >= -3 && diffWinner <= 3) vGain = 6;
      else if (diffWinner >= -5) vGain = 7;
      else if (diffWinner >= -7) vGain = 8;
      else if (diffWinner >= -9) vGain = 9;
      else vGain = 10; // diffWinner <= -10 (Exploit)

      // Perte du perdant selon son statut
      const diffLoser = pLoser - pWinner; // > 0 si le perdant était favori
      let vLoss = -2;
      if (diffLoser >= 10) vLoss = -8; // Favori battu par un outsider
      else if (diffLoser >= 8) vLoss = -5;
      else if (diffLoser >= 6) vLoss = -4;
      else if (diffLoser >= 4) vLoss = -3;
      else if (diffLoser >= -3 && diffLoser <= 3) vLoss = -2; // Niveau équivalent
      else if (diffLoser >= -9 && diffLoser <= -4) vLoss = -1; // Défaite contre plus fort
      else vLoss = 0; // Défaite contre exploit (+10 pts)

      const multiplier = isFlash ? 2 : 1;
      return { 
        gainWinner: vGain * multiplier, 
        lossLoser: vLoss, // En mode Flash, on double la récompense, pas la punition
        rawGain: vGain * multiplier 
      };
    }

    // Indexation O(1) des matchs par joueur pour optimisation fluide
    function getPlayerBadgesHTML(player, pMatches) {
      let badgesHtml = '';
      if (!pMatches) pMatches = [];

      if (pMatches.length >= 8) badgesHtml += '<span class="badge-icon" title="🔥 Inoxydable (8+ matchs)">🔥</span>';

      let currentStreak = 0, maxStreak = 0;
      const sorted = pMatches.slice().sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0));
      for (let i = 0; i < sorted.length; i++) {
        if (sorted[i].winnerId === player.id) {
          currentStreak++;
          if (currentStreak > maxStreak) maxStreak = currentStreak;
        } else {
          currentStreak = 0;
        }
      }
      if (maxStreak >= 5) badgesHtml += '<span class="badge-icon" title="🛡️ Muraille (5+ victoires d\'affilée)">🛡️</span>';

      if (pMatches.some(m => m.winnerId === player.id && ((m.rawGain && m.rawGain >= 9) || (m.gainWinner && m.gainWinner >= 9)))) {
        badgesHtml += '<span class="badge-icon" title="⚡ Chasseur (Gros exploit)">⚡</span>';
      }

      const startPts = player.startPoints !== undefined ? player.startPoints : 100;
      if ((player.points - startPts) >= 15) {
        badgesHtml += '<span class="badge-icon" title="🚀 Remontada (+15 pts)">🚀</span>';
      }

      return badgesHtml || '<span style="color:var(--muted); font-size:0.75rem;">-</span>';
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (studentQRId) initStudentQRView();
      else if (role === 'table') initTableUI();
      else if (role === 'hub') initHubUI();

    /* =========================================================
       0. VUE CARNET ÉLÈVE
       ========================================================= */
    function initStudentQRView() {
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
        <div class="container" style="max-width:520px; margin-top:20px;">
          <div class="card" style="text-align:center;">
            <h2 style="color:#38bdf8;">🪪 Bilan Élève — Tournoi EPS</h2>
            <div id="student-profile-card" style="margin-top:20px;">Chargement des données...</div>
          </div>
        </div>
      `;

      onValue(ref(db, 'activeGroup'), (snap) => {
        if (snap.val()) {
          currentGroup = snap.val();
          loadStudentData();
        }
      });

      function loadStudentData() {
        onValue(ref(db, getGroupPath(`players/${studentQRId}`)), (snap) => {
          const player = snap.val();
          if (!player) {
            document.getElementById('student-profile-card').innerHTML = "<p style='color:var(--muted);'>Élève introuvable pour cette classe.</p>";
            return;

          player.id = studentQRId;

      let tableListeners = [];
      function cleanupTableListeners() {

      document.getElementById('mode-free-btn').onclick = () => {
        document.getElementById('free-mode-container').style.display = 'block';
        document.getElementById('poule-mode-container').style.display = 'none';

        document.getElementById('poule-mode-container').style.display = 'block';
        document.getElementById('mode-free-btn').className = 'btn btn-sm btn-secondary';
        document.getElementById('mode-poule-btn').className = 'btn btn-sm btn-purple';
      };

      onValue(ref(db, 'activeGroup'), (snap) => {
        if (snap.val()) {
          currentGroup = snap.val();
          document.getElementById('group-indicator').textContent = currentGroup.replace(/_/g, ' ');
          attachGroupListeners();

      function attachGroupListeners() {
        cleanupTableListeners();

        tableListeners.push(onValue(ref(db, getGroupPath('config')), (snap) => {
          const cfg = snap.val() || {};
          isFlashActive = cfg.flashMode || false;
          sessionNumber = cfg.sessionNumber || 1;
          options = cfg.options || { handicap: false, handicapMinDiff: 6, handicapRatio: 3, handicapMax: 4, referee: false, quests: false };

          document.getElementById('flash-banner').style.display = isFlashActive ? 'block' : 'none';
          document.getElementById('referee-box').style.display = options.referee ? 'block' : 'none';
          updateHandicapDisplay();
        }));

        tableListeners.push(onValue(ref(db, getGroupPath('players')), (snap) => {
          players = snap.val() || {};
          updatePlayerDropdowns();
          updateSelectedPlayerStats();
        }));

        tableListeners.push(onValue(ref(db, getGroupPath('history')), (snap) => {
          playedMatches = Object.entries(snap.val() || {}).map(([key, val]) => ({ id: key, ...val }));
          playerMatchesMap = {};
          playedMatches.forEach(m => {
            if (!playerMatchesMap[m.winnerId]) playerMatchesMap[m.winnerId] = [];
            if (!playerMatchesMap[m.loserId]) playerMatchesMap[m.loserId] = [];
            playerMatchesMap[m.winnerId].push(m);
            playerMatchesMap[m.loserId].push(m);
          });
          updateSelectedPlayerStats();
        }));

        tableListeners.push(onValue(ref(db, getGroupPath('poules')), (snap) => {
          activePoules = snap.val() || {};
          renderPouleDropdown();
        }));

        const p1 = document.getElementById('p1-select');
        const p2 = document.getElementById('p2-select');
        const refSel = document.getElementById('referee-select');
        const v1 = p1.value;
        const v2 = p2.value;
        const vRef = refSel.value;

        const activePlayerKeys = Object.keys(players)
          .filter(id => !players[id].absent)
          .sort((a,b) => (players[a].name || '').localeCompare(players[b].name || ''));

        const optionsHtml = activePlayerKeys.map(id => `<option value="${escapeHtml(id)}">${escapeHtml(players[id].name)} (${players[id].points} pts)</option>`).join('');

        p1.innerHTML = '<option value="">-- Joueur A --</option>' + optionsHtml;
        p2.innerHTML = '<option value="">-- Joueur B --</option>' + optionsHtml;
        refSel.innerHTML = '<option value="">-- Choisir Arbitre --</option>' + optionsHtml;

        p1.value = v1;
        p2.value = v2;
        refSel.value = vRef;
      }

      function renderPouleDropdown() {
        const dropdown = document.getElementById('poule-select-dropdown');
        const currentVal = dropdown.value;
        const pouleKeys = Object.keys(activePoules);

        if (pouleKeys.length === 0) {
          dropdown.innerHTML = '<option value="">-- Aucune poule générée par le prof --</option>';
          document.getElementById('poule-details-container').innerHTML = '<p style="text-align:center; color:var(--muted); margin-top:15px;">Le professeur n\'a pas encore généré les poules pour cette séance.</p>';
          return;
        }

        dropdown.innerHTML = '<option value="">-- Sélectionner la Poule --</option>' +
          pouleKeys.map((pKey, idx) => `<option value="${escapeHtml(pKey)}">Poule ${idx + 1} (${(activePoules[pKey].players || []).length} joueurs)</option>`).join('');

        const defaultKey = `poule_${tableId}`;
        if (activePoules[defaultKey]) dropdown.value = defaultKey;
        else if (currentVal && activePoules[currentVal]) dropdown.value = currentVal;
        else if (pouleKeys.length > 0) dropdown.value = pouleKeys[0];

        renderPouleDetails();
      }

      document.getElementById('poule-select-dropdown').onchange = renderPouleDetails;

      function renderPouleDetails() {
        const pouleKey = document.getElementById('poule-select-dropdown').value;
        const container = document.getElementById('poule-details-container');
        if (!pouleKey || !activePoules[pouleKey]) {
          container.innerHTML = '';
          return;
        }

        const poule = activePoules[pouleKey];
        const pList = poule.players || [];
        const matches = poule.matches || [];

        const stats = {};
        pList.forEach(id => {
          stats[id] = { id, name: players[id] ? players[id].name : id, victoires: 0, ptsPoule: 0, pour: 0, contre: 0, diff: 0, joues: 0 };
        });

        let totalMatchesPlayed = 0;

        matches.forEach(m => {
          if (m.scoreA !== undefined && m.scoreB !== undefined && m.scoreA !== "" && m.scoreB !== "") {
            totalMatchesPlayed++;
            const scA = parseInt(m.scoreA);
            const scB = parseInt(m.scoreB);
            
            if (stats[m.p1]) {
              stats[m.p1].joues++;
              stats[m.p1].pour += scA;
              stats[m.p1].contre += scB;
            }
            if (stats[m.p2]) {
              stats[m.p2].joues++;
              stats[m.p2].pour += scB;
              stats[m.p2].contre += scA;
            }

            if (scA > scB) {
              if (stats[m.p1]) { stats[m.p1].victoires++; stats[m.p1].ptsPoule += 3; }
              if (stats[m.p2]) { stats[m.p2].ptsPoule += 1; }
            } else if (scB > scA) {
              if (stats[m.p2]) { stats[m.p2].victoires++; stats[m.p2].ptsPoule += 3; }
              if (stats[m.p1]) { stats[m.p1].ptsPoule += 1; }
            }
          }
        });

        const isPouleFinished = matches.length > 0 && totalMatchesPlayed === matches.length;

        Object.keys(stats).forEach(id => {
          stats[id].diff = stats[id].pour - stats[id].contre;
        });

        const sortedStats = Object.values(stats).sort((a,b) => {
          if (b.ptsPoule !== a.ptsPoule) return b.ptsPoule - a.ptsPoule;
          if (b.diff !== a.diff) return b.diff - a.diff;
          return b.pour - a.pour;
        });

        container.innerHTML = `
          <div class="card" style="margin-top:10px;">
            <h3>📊 Rencontres de la Poule (11 Points)</h3>
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
              ${matches.map((m, idx) => `
                <div style="display:flex; align-items:center; justify-content:space-between; background:#090d16; padding:8px 12px; border-radius:6px; border:1px solid var(--border);">
                  <span style="font-size:0.88rem; flex:1;"><strong>${escapeHtml(players[m.p1] ? players[m.p1].name : m.p1)}</strong></span>
                  <input type="number" class="score-input" id="sc-${pouleKey}-${idx}-a" value="${m.scoreA !== undefined ? m.scoreA : ''}" min="0" max="30">
                  <span style="margin:0 8px; font-weight:bold;">-</span>
                  <input type="number" class="score-input" id="sc-${pouleKey}-${idx}-b" value="${m.scoreB !== undefined ? m.scoreB : ''}" min="0" max="30">
                  <span style="font-size:0.88rem; flex:1; text-align:right;"><strong>${escapeHtml(players[m.p2] ? players[m.p2].name : m.p2)}</strong></span>
                </div>
              `).join('')}
            </div>
            <button class="btn btn-success" id="btn-save-poule-scores" style="margin-top:14px;">💾 Enregistrer les Scores</button>
          </div>

          <div class="card">
            <h3>🏆 Classement Direct de la Poule</h3>
            ${!isPouleFinished ? `
              <div style="text-align:center; padding:10px; background:#090d16; border-radius:8px; border:1px solid var(--warning); color:#fcd34d; font-size:0.85rem; margin-bottom:10px;">
                ⏳ <strong>Poule en cours (${totalMatchesPlayed} / ${matches.length} matchs joués)</strong><br>
                Les notes /6 seront calculées et enregistrées une fois tous les scores saisis.
              </div>
            ` : ''}
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Élève</th>
                  <th>Pts Poule</th>
                  <th>V.</th>
                  <th>Diff</th>
                  ${isPouleFinished ? '<th>Note /6</th>' : ''}
                </tr>
              </thead>
              <tbody>
                ${sortedStats.map((st, idx) => {
                  const note6 = getPouleNote6(idx + 1, st.victoires);
                  return `
                    <tr>
                      <td><strong>${idx + 1}</strong></td>
                      <td>${escapeHtml(st.name)}</td>
                      <td><span class="badge-win">${st.ptsPoule}</span></td>
                      <td>${st.victoires}</td>
                      <td><strong style="color:${st.diff >= 0 ? 'var(--success)' : 'var(--danger)'};">${st.diff > 0 ? '+' + st.diff : st.diff}</strong></td>
                      ${isPouleFinished ? `<td><strong style="color:#a855f7;">${note6} / 6</strong></td>` : ''}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('btn-save-poule-scores').onclick = async () => {
          const saveBtn = document.getElementById('btn-save-poule-scores');
          saveBtn.disabled = true;

          try {
            const updatedMatches = matches.map((m, idx) => {
              const elA = document.getElementById(`sc-${pouleKey}-${idx}-a`);
              const elB = document.getElementById(`sc-${pouleKey}-${idx}-b`);
              const scA = elA ? elA.value.trim() : "";
              const scB = elB ? elB.value.trim() : "";
              return {
                ...m,
                scoreA: scA !== "" ? parseInt(scA) : "",
                scoreB: scB !== "" ? parseInt(scB) : ""
              };
            });

            // RE-CALCUL FRAIS DES STATS AVEC LES NOUVEAUX SCORES SAISIS
            const freshStats = {};
            pList.forEach(id => {
              freshStats[id] = { id, victoires: 0, ptsPoule: 0, pour: 0, contre: 0, diff: 0 };
            });

            updatedMatches.forEach(m => {
              if (m.scoreA !== "" && m.scoreB !== "") {
                const a = parseInt(m.scoreA);
                const b = parseInt(m.scoreB);
                if (freshStats[m.p1]) { freshStats[m.p1].pour += a; freshStats[m.p1].contre += b; }
                if (freshStats[m.p2]) { freshStats[m.p2].pour += b; freshStats[m.p2].contre += a; }
                if (a > b) {
                  if (freshStats[m.p1]) { freshStats[m.p1].victoires++; freshStats[m.p1].ptsPoule += 3; }
                  if (freshStats[m.p2]) { freshStats[m.p2].ptsPoule += 1; }
                } else if (b > a) {
                  if (freshStats[m.p2]) { freshStats[m.p2].victoires++; freshStats[m.p2].ptsPoule += 3; }
                  if (freshStats[m.p1]) { freshStats[m.p1].ptsPoule += 1; }
                }
              }
            });

            Object.keys(freshStats).forEach(id => {
              freshStats[id].diff = freshStats[id].pour - freshStats[id].contre;
            });

            const freshSorted = Object.values(freshStats).sort((a,b) => {
              if (b.ptsPoule !== a.ptsPoule) return b.ptsPoule - a.ptsPoule;
              if (b.diff !== a.diff) return b.diff - a.diff;
              return b.pour - a.pour;
            });

            // Écriture atomique dans Firebase
            const updates = {};
            updates[getGroupPath(`poules/${pouleKey}/matches`)] = updatedMatches;

            const allFilled = updatedMatches.every(m => m.scoreA !== "" && m.scoreB !== "");
            if (allFilled) {
              freshSorted.forEach((st, idx) => {
                const note6 = getPouleNote6(idx + 1, st.victoires);
                updates[getGroupPath(`players/${st.id}/pouleNote`)] = note6;
              });
              await update(ref(db), updates);
              showToast("Poule terminée ! Notes /6 enregistrées.");
            } else {
              await update(ref(db), updates);
              showToast("Scores de poule enregistrés.");
            }

            playVictorySound();
          } catch (err) {
            console.error(err);
            showToast("Erreur lors de l'enregistrement", "danger");
          } finally {
            saveBtn.disabled = false;
          }
        };
      }

      function updateHandicapDisplay() {
        const hBox = document.getElementById('handicap-box');
        if (!options.handicap) {
          hBox.style.display = 'none';
          return;
        }

        const id1 = document.getElementById('p1-select').value;
        const id2 = document.getElementById('p2-select').value;

        if (id1 && id2 && id1 !== id2 && players[id1] && players[id2]) {
          const p1 = players[id1];
          const p2 = players[id2];
          const diff = Math.abs(p1.points - p2.points);

          const minDiff = options.handicapMinDiff || 6;
          const ratio = options.handicapRatio || 3;
          const maxBonus = options.handicapMax || 4;

          if (diff >= minDiff) {
            const handicap = Math.min(Math.floor((diff - minDiff + ratio) / ratio), maxBonus);
            const weaker = p1.points < p2.points ? p1.name : p2.name;
            hBox.textContent = `⚖️ Handicap : ${weaker} démarre avec +${handicap} pts d'avance !`;
            hBox.style.display = 'block';
            return;
          }
        }
        hBox.style.display = 'none';
      }

      function renderPlayerStatsAndQuests(playerId, containerId) {
        const box = document.getElementById(containerId);
        if (!playerId || !players[playerId]) {
          box.style.display = 'none';
          return;
        }

        const p = players[playerId];
        p.id = playerId;
        const pMatches = playerMatchesMap[playerId] || [];
        const wins = pMatches.filter(m => m.winnerId === playerId).length;
        const losses = pMatches.length - wins;
        const winRate = pMatches.length > 0 ? Math.round((wins / pMatches.length) * 100) : 0;
        
        const badges = getPlayerBadgesHTML(p, pMatches);

        let questHtml = '';
        if (options.quests && p.questId) {
          const q = currentQuests.find(x => x.id === p.questId);
          if (q) {
            questHtml = `<div class="quest-box">🎯 <strong>Quête Secrète :</strong> ${escapeHtml(q.text)} (+${q.bonus} pts bonus)</div>`;
          }
        }

        box.innerHTML = `
          <strong>📊 ${escapeHtml(p.name)} :</strong> ${wins}V / ${losses}D (${winRate}%) | Badges: ${badges}
          ${questHtml}
        `;
        box.style.display = 'block';
      }

      function updateSelectedPlayerStats() {
        renderPlayerStatsAndQuests(document.getElementById('p1-select').value, 'p1-stats');
        renderPlayerStatsAndQuests(document.getElementById('p2-select').value, 'p2-stats');
        updateHandicapDisplay();
      }

      document.getElementById('app').addEventListener('change', (e) => {
        if (e.target.id === 'p1-select' || e.target.id === 'p2-select') {
          updateSelectedPlayerStats();
          
          const id1 = document.getElementById('p1-select').value;
          const id2 = document.getElementById('p2-select').value;
          const actions = document.getElementById('match-actions');

          if (id1 && id2) {
            if (id1 === id2) {
              showToast("⚠️ Un joueur ne peut pas s'affronter lui-même !", "warning");
              actions.style.display = "none";
              return;
            }

            const alreadyPlayedSession = playedMatches.some(m => 
              (m.session === sessionNumber || !m.session) &&
              ((m.winnerId === id1 && m.loserId === id2) || (m.winnerId === id2 && m.loserId === id1))
            );

            if (alreadyPlayedSession) {
              showToast("⚠️ Revanche interdite : cet adversaire a déjà été affronté cette séance !", "warning");
              actions.style.display = "none";
              return;
            }

            document.getElementById('btn-p1-win').textContent = `Victoire de ${players[id1].name}`;
            document.getElementById('btn-p2-win').textContent = `Victoire de ${players[id2].name}`;
            actions.style.display = "block";
          } else {
            actions.style.display = "none";
          }
        }
      });

      async function recordMatch(winnerId, loserId) {
        if (isSubmittingMatch) return;
        if (!winnerId || !loserId || winnerId === loserId) return;

        if (options.referee) {
          const refId = document.getElementById('referee-select').value;
          if (!refId) return showToast("⚠️ Choisir un arbitre !", "danger");
          if (refId === winnerId || refId === loserId) return showToast("⚠️ L'arbitre doit être tiers !", "danger");
        }

        const w = players[winnerId];
        const l = players[loserId];
        if (!w || !l) return;

        const refId = document.getElementById('referee-select').value;
        const { gainWinner, lossLoser, rawGain } = calculatePointsDelta(w.points, l.points, isFlashActive);

        isSubmittingMatch = true;
        document.getElementById('btn-p1-win').disabled = true;
        document.getElementById('btn-p2-win').disabled = true;

        try {
          const updates = {};
          updates[getGroupPath(`players/${winnerId}/points`)] = w.points + gainWinner;
          updates[getGroupPath(`players/${loserId}/points`)] = l.points + lossLoser;
          updates[getGroupPath(`players/${winnerId}/matches`)] = (w.matches || 0) + 1;
          updates[getGroupPath(`players/${loserId}/matches`)] = (l.matches || 0) + 1;

          if (options.referee && refId && players[refId]) {
            updates[getGroupPath(`players/${refId}/refereeCount`)] = (players[refId].refereeCount || 0) + 1;
          }

          const newMatchRef = push(ref(db, getGroupPath('history')));
          updates[getGroupPath(`history/${newMatchRef.key}`)] = {
            table: tableId,
            session: sessionNumber,
            winnerId,
            loserId,
            refereeId: options.referee ? refId : null,
            refereeName: options.referee && players[refId] ? players[refId].name : null,
            winnerName: w.name,
            loserName: l.name,
            gainWinner,
            lossLoser,
            rawGain,
            isFlash: isFlashActive,
            timestamp: Date.now()
          };

          // Écriture atomique unique
          await update(ref(db), updates);

          playVictorySound();
          showToast(`Match enregistré ! ${w.name} (+${gainWinner} pts)`);

          document.getElementById('p1-select').value = "";
          document.getElementById('p2-select').value = "";
          document.getElementById('referee-select').value = "";
          document.getElementById('p1-stats').style.display = "none";
          document.getElementById('p2-stats').style.display = "none";
          document.getElementById('handicap-box').style.display = "none";
          document.getElementById('match-actions').style.display = "none";
        } catch (err) {
          console.error(err);
          showToast("Erreur lors de l'enregistrement du match", "danger");
        } finally {
          isSubmittingMatch = false;
          const btn1 = document.getElementById('btn-p1-win');
          const btn2 = document.getElementById('btn-p2-win');
          if (btn1) btn1.disabled = false;
          if (btn2) btn2.disabled = false;
        }
      }

      document.getElementById('app').addEventListener('click', (e) => {
        const id1 = document.getElementById('p1-select').value;
        const id2 = document.getElementById('p2-select').value;
        if (e.target.id === 'btn-p1-win') recordMatch(id1, id2);
        if (e.target.id === 'btn-p2-win') recordMatch(id2, id1);
      });
    }

      function renderProfPoulesOverview() {
        const container = document.getElementById('prof-poules-container');
        const pouleKeys = Object.keys(activePoulesData);

        if (pouleKeys.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:0.9rem;">Aucune poule générée pour le moment. Allez dans l\'onglet Options EPS pour en créer.</p>';
          return;
        }

        container.innerHTML = pouleKeys.map((pKey, idx) => {
          const poule = activePoulesData[pKey];
          const pList = poule.players || [];
          const matches = poule.matches || [];

          const stats = {};
          pList.forEach(id => {
            stats[id] = { id, name: playersData[id] ? playersData[id].name : id, victoires: 0, ptsPoule: 0, pour: 0, contre: 0, diff: 0, joues: 0 };
          });

          let totalMatchesPlayed = 0;

          matches.forEach(m => {
            if (m.scoreA !== undefined && m.scoreB !== undefined && m.scoreA !== "" && m.scoreB !== "") {
              totalMatchesPlayed++;
              const scA = parseInt(m.scoreA);
              const scB = parseInt(m.scoreB);
              
              if (stats[m.p1]) { stats[m.p1].joues++; stats[m.p1].pour += scA; stats[m.p1].contre += scB; }
              if (stats[m.p2]) { stats[m.p2].joues++; stats[m.p2].pour += scB; stats[m.p2].contre += scA; }

              if (scA > scB) {
                if (stats[m.p1]) { stats[m.p1].victoires++; stats[m.p1].ptsPoule += 3; }
                if (stats[m.p2]) { stats[m.p2].ptsPoule += 1; }
              } else if (scB > scA) {
                if (stats[m.p2]) { stats[m.p2].victoires++; stats[m.p2].ptsPoule += 3; }
                if (stats[m.p1]) { stats[m.p1].ptsPoule += 1; }
              }
            }
          });

          const isPouleFinished = matches.length > 0 && totalMatchesPlayed === matches.length;

          Object.keys(stats).forEach(id => {
            stats[id].diff = stats[id].pour - stats[id].contre;
          });

          const sortedStats = Object.values(stats).sort((a,b) => {
            if (b.ptsPoule !== a.ptsPoule) return b.ptsPoule - a.ptsPoule;
            if (b.diff !== a.diff) return b.diff - a.diff;
            return b.pour - a.pour;
          });

          return `
            <div class="card" style="background:#090d16; margin-bottom:10px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h4 style="color:#38bdf8; margin:0; font-size:1rem;">Poule ${idx + 1} (Table ${idx + 1})</h4>
                <span style="font-size:0.8rem; font-weight:bold; color:${isPouleFinished ? 'var(--success)' : 'var(--warning)'};">
                  ${isPouleFinished ? '✅ Poule Terminée' : `⏳ ${totalMatchesPlayed} / ${matches.length} matchs`}
                </span>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Élève</th>
                    <th>Pts Poule</th>
                    <th>V.</th>
                    <th>M. Joués</th>
                    <th>+ / -</th>
                    <th>Diff</th>
                    ${isPouleFinished ? '<th>Note /6</th>' : ''}
                  </tr>
                </thead>
                <tbody>
                  ${sortedStats.map((st, sIdx) => {
                    const note6 = getPouleNote6(sIdx + 1, st.victoires);
                    return `
                      <tr>
                        <td><strong>${sIdx + 1}</strong></td>
                        <td>${escapeHtml(st.name)}</td>
                        <td><span class="badge-win">${st.ptsPoule}</span></td>
                        <td>${st.victoires}</td>
                        <td>${st.joues}</td>
                        <td>${st.pour} / ${st.contre}</td>
                        <td><strong style="color:${st.diff >= 0 ? 'var(--success)' : 'var(--danger)'};">${st.diff > 0 ? '+' + st.diff : st.diff}</strong></td>
                        ${isPouleFinished ? `<td><strong style="color:#a855f7;">${note6} / 6</strong></td>` : ''}
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        }).join('');
      }

      // Algorithme de partitionnement mathématiquement exact pour N élèves
      async function generatePoules(mode = 'rank') {
        const activeStudents = Object.entries(playersData)
          .map(([id, p]) => ({ id, ...p }))
          .filter(p => !p.absent);

        const total = activeStudents.length;
        if (total < 3) {
          return showToast("⚠️ Pas assez d'élèves présents (min 3) !", "danger");
        }

        if (mode === 'rank') {
          activeStudents.sort((a,b) => b.points - a.points);
        } else {
          activeStudents.sort((a,b) => {
            const noteA = a.note12 !== undefined ? parseFloat(a.note12) : -1;
            const noteB = b.note12 !== undefined ? parseFloat(b.note12) : -1;
            if (noteB !== noteA) return noteB - noteA;
            return b.points - a.points;
          });
        }

        // Décomposition mathématique en poules de 4 et 3
        let pouleSizes = [];
        if (total === 5) {
          pouleSizes = [5];
        } else {
          let num4 = Math.floor(total / 4);
          let rem = total % 4;
          let num3 = 0;
          if (rem === 1) {
            if (num4 >= 2) {
              num4 -= 2;
              num3 = 3;
            }
          } else if (rem === 2) {
            if (num4 >= 1) {
              num4 -= 1;
              num3 = 2;
            }
          } else if (rem === 3) {
            num3 = 1;
          }
          pouleSizes = [...Array(num4).fill(4), ...Array(num3).fill(3)];
        }

        const poules = {};
        let studentIdx = 0;

        pouleSizes.forEach((size, pIdx) => {
          const pGroup = activeStudents.slice(studentIdx, studentIdx + size).map(s => s.id);
          const pKey = `poule_${pIdx + 1}`;
          const matches = [];

          if (pGroup.length === 5) {
            matches.push({ p1: pGroup[0], p2: pGroup[1] });
            matches.push({ p1: pGroup[2], p2: pGroup[3] });
            matches.push({ p1: pGroup[0], p2: pGroup[4] });
            matches.push({ p1: pGroup[1], p2: pGroup[2] });
            matches.push({ p1: pGroup[3], p2: pGroup[4] });
            matches.push({ p1: pGroup[0], p2: pGroup[2] });
            matches.push({ p1: pGroup[1], p2: pGroup[3] });
            matches.push({ p1: pGroup[2], p2: pGroup[4] });
            matches.push({ p1: pGroup[0], p2: pGroup[3] });
            matches.push({ p1: pGroup[1], p2: pGroup[4] });
          } else if (pGroup.length === 4) {
            matches.push({ p1: pGroup[0], p2: pGroup[1] });
            matches.push({ p1: pGroup[2], p2: pGroup[3] });
            matches.push({ p1: pGroup[0], p2: pGroup[2] });
            matches.push({ p1: pGroup[1], p2: pGroup[3] });
            matches.push({ p1: pGroup[0], p2: pGroup[3] });
            matches.push({ p1: pGroup[1], p2: pGroup[2] });
          } else if (pGroup.length === 3) {
            // Aller-retour en poule de 3 pour garantir au moins 4 matchs par élève
            matches.push({ p1: pGroup[0], p2: pGroup[1] });
            matches.push({ p1: pGroup[1], p2: pGroup[2] });
            matches.push({ p1: pGroup[2], p2: pGroup[0] });
            matches.push({ p1: pGroup[1], p2: pGroup[0] });
            matches.push({ p1: pGroup[2], p2: pGroup[1] });
            matches.push({ p1: pGroup[0], p2: pGroup[2] });
          }

          poules[pKey] = {
            players: pGroup,
            matches: matches
          };

          studentIdx += size;
        });

        await set(ref(db, getGroupPath('poules')), poules);
        const modeTxt = mode === 'rank' ? 'Classement Défis' : 'Niveaux de Jeu';
        showToast(`⚡ ${pouleSizes.length} Poules générées selon le ${modeTxt} !`);
        switchTab('poules');
      }

      document.getElementById('btn-generate-poules-rank').onclick = () => generatePoules('rank');
      document.getElementById('btn-generate-poules-level').onclick = () => generatePoules('level');

      // CLASSEMENT
      function renderRankingTable() {
        const sorted = Object.entries(playersData)
          .map(([id, p]) => ({ id, ...p }))
          .sort((a, b) => b.points - a.points);
        const half = Math.ceil(sorted.length / 2);
        const col1 = sorted.slice(0, half);
        const col2 = sorted.slice(half);

        function createRowsHtml(list, offset) {
          return list.map((p, index) => {
            const pMatches = playerMatchesMap[p.id] || [];
            const badges = getPlayerBadgesHTML(p, pMatches);
            const absentTag = p.absent ? ' <span style="color:#ef4444; font-size:0.75rem;">(Absent)</span>' : '';

            return `
              <tr style="${p.absent ? 'opacity:0.5;' : ''}">
                <td><strong>${index + 1 + offset}</strong></td>
                <td>${escapeHtml(p.name)}${absentTag}</td>
                <td><span class="badge-win">${p.points}</span></td>
                <td>${p.matches || 0}</td>
                <td>${badges}</td>
                <td class="no-print">
                  <button class="btn btn-sm btn-secondary btn-qr-student" data-id="${escapeHtml(p.id)}" data-name="${escapeHtml(p.name)}" style="padding:4px 8px;">🪪</button>
                </td>
              </tr>
            `;
          }).join('');
        }

        document.getElementById('ranking-body-1').innerHTML = createRowsHtml(col1, 0);
        document.getElementById('ranking-body-2').innerHTML = createRowsHtml(col2, half);
      }

      document.getElementById('tab-ranking').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-qr-student');
        if (btn) {
          openStudentQR(btn.dataset.id, btn.dataset.name);
        }
      });

      function openStudentQR(studentId, studentName) {
        document.getElementById('modal-student-name').textContent = `Bilan : ${studentName}`;
        const container = document.getElementById('qrcode-student');
        container.innerHTML = '';

        const studentUrl = `${baseUrl}?student=${encodeURIComponent(studentId)}`;
        new QRCode(container, {
          text: studentUrl,
          width: 150, height: 150
        });

        document.getElementById('qr-modal').style.display = 'flex';
      }

      window.closeQRModal = () => {
        document.getElementById('qr-modal').style.display = 'none';
      };

      document.getElementById('btn-close-qr-modal').onclick = closeQRModal;

      document.getElementById('qr-modal').addEventListener('click', (e) => {
        if (e.target.id === 'qr-modal') {
          closeQRModal();
        }
      });

      function renderProgressTable() {
        const list = Object.entries(playersData).map(([id, p]) => {
          const startPts = p.startPoints !== undefined ? p.startPoints : 100;
          const ptsGained = p.points - startPts;
          return { name: p.name, startPts, currentPts: p.points, ptsGained, absent: p.absent };
        }).sort((a,b) => b.ptsGained - a.ptsGained);

        const tbody = document.getElementById('progress-body');
        tbody.innerHTML = list.map((p, idx) => {
          let gainClass = 'gain-neutral';
          let formattedGain = `${p.ptsGained} pt`;
          if (p.ptsGained > 0) {
            gainClass = 'gain-positive';
            formattedGain = `+${p.ptsGained} pts`;
          } else if (p.ptsGained < 0) {
            gainClass = 'gain-negative';
            formattedGain = `${p.ptsGained} pts`;
          }

          return `
            <tr style="${p.absent ? 'opacity:0.5;' : ''}">
              <td><strong>#${idx + 1}</strong></td>
              <td>${escapeHtml(p.name)} ${p.absent ? '(Absent)' : ''}</td>
              <td><span class="${gainClass}">${formattedGain}</span></td>
              <td>${p.startPts} pts</td>
              <td>${p.currentPts} pts</td>
            </tr>
          `;
        }).join('');
      }

      function renderStudentManageList() {
        const container = document.getElementById('student-manage-container');
        const sorted = Object.entries(playersData)
          .map(([id, p]) => ({ id, ...p }))
          .sort((a,b) => (a.name || '').localeCompare(b.name || ''));

        if (sorted.length === 0) {
          container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">Aucun élève enregistré.</p>';
          return;
        }

        container.innerHTML = sorted.map(p => `
          <div class="student-manage-item ${p.absent ? 'is-absent' : ''}">
            <span><strong>${escapeHtml(p.name)}</strong> (${p.points} pts)</span>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-sm ${p.absent ? 'btn-success' : 'btn-warning'} btn-toggle-absent" data-id="${escapeHtml(p.id)}" data-absent="${!p.absent}">
                ${p.absent ? '👁️ Présent' : '🙈 Absent'}
              </button>
              <button class="btn btn-sm btn-danger btn-delete-student" data-id="${escapeHtml(p.id)}" data-name="${escapeHtml(p.name)}">
                🗑️
              </button>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('student-manage-container').addEventListener('click', async (e) => {
        const toggleBtn = e.target.closest('.btn-toggle-absent');
        if (toggleBtn) {
          const playerId = toggleBtn.dataset.id;
          const absentStatus = toggleBtn.dataset.absent === 'true';
          await set(ref(db, getGroupPath(`players/${playerId}/absent`)), absentStatus);
          showToast(absentStatus ? "Élève marqué absent" : "Élève de retour", absentStatus ? "warning" : "success");
          return;
        }

        const delBtn = e.target.closest('.btn-delete-student');
        if (delBtn) {
          const playerId = delBtn.dataset.id;
          const playerName = delBtn.dataset.name;
          if (confirm(`Supprimer définitivement "${playerName}" de cette classe ?`)) {
            await remove(ref(db, getGroupPath(`players/${playerId}`)));
            showToast(`Élève ${playerName} supprimé.`, "warning");
          }
        }
      });

      function renderHistoryTable() {
        const tbody = document.getElementById('history-body');
        const entries = [...historyMatches].reverse();

        tbody.innerHTML = entries.map((m) => `
          <tr>
            <td>S${m.session || 1}</td>
            <td>T${escapeHtml(m.table)} ${m.isFlash ? '⚡' : ''}</td>
            <td><strong>${escapeHtml(m.winnerName)}</strong> (+${m.gainWinner})</td>
            <td>${escapeHtml(m.loserName)} (${m.lossLoser})</td>
            <td>${escapeHtml(m.refereeName || '-')}</td>
            <td class="no-print">
              <button class="btn btn-danger btn-sm btn-cancel-match" data-key="${escapeHtml(m.key)}" data-wid="${escapeHtml(m.winnerId)}" data-lid="${escapeHtml(m.loserId)}" data-gw="${m.gainWinner}" data-ll="${m.lossLoser}" data-ref="${escapeHtml(m.refereeId || '')}">
                Annuler
              </button>
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('history-body').addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-cancel-match');
        if (btn) {
          if (confirm("Annuler ce match et corriger le classement ?")) {
            const matchKey = btn.dataset.key;
            const wId = btn.dataset.wid;
            const lId = btn.dataset.lid;
            const gainW = parseInt(btn.dataset.gw) || 0;
            const lossL = parseInt(btn.dataset.ll) || 0;
            const refId = btn.dataset.ref;

            const w = playersData[wId];
            const l = playersData[lId];

            const updates = {};
            if (w) {
              updates[getGroupPath(`players/${wId}/points`)] = w.points - gainW;
              updates[getGroupPath(`players/${wId}/matches`)] = Math.max(0, (w.matches || 1) - 1);
            }
            if (l) {
              updates[getGroupPath(`players/${lId}/points`)] = l.points - lossL;
              updates[getGroupPath(`players/${lId}/matches`)] = Math.max(0, (l.matches || 1) - 1);
            }
            if (refId && playersData[refId]) {
              updates[getGroupPath(`players/${refId}/refereeCount`)] = Math.max(0, (playersData[refId].refereeCount || 1) - 1);
            }
            updates[getGroupPath(`history/${matchKey}`)] = null;

            await update(ref(db), updates);
            showToast("Match annulé", "warning");
          }
        }
      });

      // Export CSV Pronote avec BOM UTF-8
      document.getElementById('btn-export-csv').onclick = () => {
        const sorted = Object.entries(playersData).map(([id, p]) => {
          const start = p.startPoints !== undefined ? p.startPoints : 100;
          const note12 = p.note12 !== undefined ? p.note12 : "";
          const lvlNum = getLevelFromNote(currentGradeLevel, note12);
          const note6 = p.pouleNote !== undefined ? p.pouleNote : "";
          return {
            Nom: p.name,
            Statut: p.absent ? "Absent" : "Present",
            NoteSur12: note12,
            NiveauJeu: lvlNum || "",
            NotePouleSur6: note6,
            PointsActuels: p.points,
            CapitalDepart: start,
            Progression: p.points - start,
            MatchsJoues: p.matches || 0,
            Arbitrages: p.refereeCount || 0
          };
        }).sort((a,b) => b.PointsActuels - a.PointsActuels);

        let csvContent = "\uFEFFNom;Statut;Note Sur 12;Niveau Jeu;Note Poule Sur 6;Points Actuels;Capital Depart;Progression;Matchs Joues;Arbitrages\r\n";
        sorted.forEach(r => {
          const cleanName = (r.Nom || '').replace(/"/g, '""');
          csvContent += `"${cleanName}";${r.Statut};${r.NoteSur12};${r.NiveauJeu};${r.NotePouleSur6};${r.PointsActuels};${r.CapitalDepart};${r.Progression};${r.MatchsJoues};${r.Arbitrages}\r\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `export_${currentGroup}_${currentGradeLevel}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      let flashActive = false;
      document.getElementById('btn-toggle-flash').onclick = () => {
        flashActive = !flashActive;
        set(ref(db, getGroupPath('config/flashMode')), flashActive);
        document.getElementById('btn-toggle-flash').textContent = flashActive 
          ? "⚡ DÉFI FLASH ACTIF !" 
          : "⚡ Défi Flash (Pts x2)";
      };

      document.getElementById('btn-save-options').onclick = async () => {
        const h = document.getElementById('opt-handicap').checked;
        const hMin = parseInt(document.getElementById('handicap-min-diff').value) || 6;
        const hRatio = parseInt(document.getElementById('handicap-ratio').value) || 3;
        const r = document.getElementById('opt-referee').checked;
        const q = document.getElementById('opt-quests').checked;

        const updates = {};
        updates[getGroupPath('config/options')] = { 
          handicap: h, 
          handicapMinDiff: hMin,
          handicapRatio: hRatio,
          handicapMax: 4,
          referee: r, 
          quests: q 
        };

        // Attribution automatique d'une quête si activée
        if (q) {
          for (let id in playersData) {
            if (!playersData[id].questId && questBank.length > 0) {
              const randomQuest = questBank[Math.floor(Math.random() * questBank.length)];
              updates[getGroupPath(`players/${id}/questId`)] = randomQuest.id;
            }
          }
        }

        await update(ref(db), updates);
        showToast("Options et paramètres enregistrés !");
      };

      document.getElementById('btn-next-session').onclick = async () => {
        if (confirm("Passer à la séance suivante ? Les scores actuels deviendront le nouveau capital de départ.")) {
          const updates = {};
          for (let id in playersData) {
            updates[getGroupPath(`players/${id}/startPoints`)] = playersData[id].points;
            if (options.quests && questBank.length > 0) {
              const randomQuest = questBank[Math.floor(Math.random() * questBank.length)];
              updates[getGroupPath(`players/${id}/questId`)] = randomQuest.id;
            }
          }
          updates[getGroupPath('config/sessionNumber')] = currentSession + 1;
          updates[getGroupPath('config/flashMode')] = false;

          await update(ref(db), updates);
          showToast(`Séance ${currentSession + 1} démarrée !`);
        }
      };

      document.getElementById('btn-init-class').onclick = async () => {
        const names = document.getElementById('import-names').value
          .split('\n')
          .map(n => n.trim())
          .filter(n => n.length > 0);

        if (names.length === 0) return showToast("Saisir au moins un nom d'élève", "danger");

        if (confirm(`Remplacer les élèves de la classe "${currentGroup.replace(/_/g, ' ')}" ?`)) {
          let startPoints = 100;
          const newPlayers = {};
          names.forEach((name, idx) => {
            const id = `p_${idx + 1}`;
            const randomQuest = questBank.length > 0 ? questBank[Math.floor(Math.random() * questBank.length)] : null;
            newPlayers[id] = { 
              name: name, 
              points: startPoints, 
              startPoints: startPoints, 
              matches: 0,
              refereeCount: 0,
              absent: false,
              questId: randomQuest ? randomQuest.id : null
            };
            startPoints--;
          });

          const updates = {};
          updates[getGroupPath('players')] = newPlayers;
          updates[getGroupPath('history')] = null;
          updates[getGroupPath('poules')] = null;
          updates[getGroupPath('config/sessionNumber')] = 1;
          updates[getGroupPath('config/flashMode')] = false;

          await update(ref(db), updates);
          showToast("Classe chargée avec succès !");
          switchTab('ranking');
        }
      };

      document.getElementById('btn-reset-session-data').onclick = async () => {
        if (confirm(`Effacer les matchs et remettre les scores à zéro pour "${currentGroup.replace(/_/g, ' ')}" ?`)) {
          const updates = {};
          updates[getGroupPath('history')] = null;
          updates[getGroupPath('poules')] = null;
          for (let id in playersData) {
            const startPts = playersData[id].startPoints !== undefined ? playersData[id].startPoints : 100;
            updates[getGroupPath(`players/${id}/points`)] = startPts;
            updates[getGroupPath(`players/${id}/matches`)] = 0;
            updates[getGroupPath(`players/${id}/refereeCount`)] = 0;
            updates[getGroupPath(`players/${id}/pouleNote`)] = null;
          }
          updates[getGroupPath('config/sessionNumber')] = 1;

          await update(ref(db), updates);
          showToast("Matchs et poules effacés pour la classe active", "warning");
        }
      };

      document.getElementById('btn-delete-current-group').onclick = async () => {
        if (confirm(`Supprimer définitivement la classe "${currentGroup.replace(/_/g, ' ')}" et toutes ses données ?`)) {
          await remove(ref(db, `groups/${currentGroup}`));
          
          const snap = await new Promise(res => onValue(ref(db, 'groups'), snap => res(snap), { onlyOnce: true }));
          const remainingGroups = Object.keys(snap.val() || {});

          if (remainingGroups.length > 0) {
            currentGroup = remainingGroups[0];
          } else {
            currentGroup = "Classe_1";
            await set(ref(db, "groups/Classe_1"), true);
          }

          localStorage.setItem('eps_current_group', currentGroup);
          await set(ref(db, 'activeGroup'), currentGroup);
          attachListeners();
          showToast("Classe supprimée", "warning");
        }
      };
    }
  </script>
