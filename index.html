<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tournoi Défis Tennis de Table EPS</title>
  
  <!-- Bibliothèque QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    h1, h2, h3 { text-align: center; margin-top: 5px; }
    
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
    .btn { background: var(--accent); color: white; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; margin-top: 10px; }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); font-size: 0.9rem; padding: 6px 12px; width: auto; }
    .btn-warning { background: var(--warning); }
    
    select, input, textarea { width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); margin-top: 8px; }
    
    /* Navigation / Tabs sur la vue Prof */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }
    .tab-btn.active { background: var(--accent); }

    /* Hub QR Code */
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .qr-card { background: var(--card); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
    .qr-card div { background: white; padding: 10px; border-radius: 8px; margin: 10px 0; }

    /* Vue Prof & Tableaux */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #0284c7; color: white; }
    tr:nth-child(even) { background: #1e293b; }

    /* Timer */
    .timer-display { font-size: 3rem; font-weight: bold; text-align: center; color: #38bdf8; font-family: monospace; margin: 10px 0; }
    .timer-controls { display: flex; gap: 10px; }
    .timer-controls button { flex: 1; }

    /* Badges */
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    .badge-win { background: #16a34a22; color: #4ade80; border: 1px solid #16a34a; }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REMPLACE PAR TA CONFIGURATION FIREBASE EXACTE
    const firebaseConfig = {
      apiKey: "AIzaSyDOOuIvyEriDGNmKPb4Jy25yB_lE1gBAZk",
      databaseURL: "https://tournoi-defis-tt-default-rtdb.firebaseio.com",
      projectId: "tournoi-defis-tt"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role') || 'prof';
    const tableId = urlParams.get('id') || '1';

    // Barème Tournoi Défis EPS
    function calculatePointsDelta(pWinner, pLoser) {
      const diff = pWinner - pLoser;
      let vGain = 5;

      if (diff >= 10) vGain = 1;
      else if (diff >= 8) vGain = 2;
      else if (diff >= 6) vGain = 3;
      else if (diff >= 4) vGain = 4;
      else if (diff >= 1) vGain = 5;
      else if (diff === 0) vGain = 5;
      else if (diff >= -3) vGain = 5;
      else if (diff >= -5) vGain = 6;
      else if (diff >= -7) vGain = 7;
      else if (diff >= -9) vGain = 8;
      else vGain = 9;

      return { gainWinner: vGain + 1, lossLoser: -vGain + 1, rawDelta: vGain };
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (role === 'table') initTableUI();
      else if (role === 'hub') initHubUI();
      else initProfUI();
    });

    /* =========================================================
       1. VUE HUB (GÉNÉRATEUR DE QR CODES & LIENS POUR TABLES)
       ========================================================= */
    function initHubUI() {
      const baseUrl = window.location.origin + window.location.pathname;
      document.getElementById('app').innerHTML = `
        <div class="container">
          <h1>📱 Hub de Connexion des iPad Tables</h1>
          <p style="text-align:center;">Scannez le QR Code depuis l'iPad d'une table pour configurer l'application instantanément.</p>
          <div class="card">
            <label>Nombre de tables dans le gymnase :</label>
            <input type="number" id="nb-tables" value="8" min="1" max="24">
            <button class="btn" id="btn-gen-qr">Générer les QR Codes</button>
          </div>
          <div class="qr-grid" id="qr-container"></div>
        </div>
      `;

      function generateQRCodes() {
        const count = parseInt(document.getElementById('nb-tables').value) || 8;
        const container = document.getElementById('qr-container');
        container.innerHTML = '';

        for (let i = 1; i <= count; i++) {
          const tableUrl = `${baseUrl}?role=table&id=${i}`;
          const card = document.createElement('div');
          card.className = 'qr-card';
          card.innerHTML = `
            <h3>Table ${i}</h3>
            <div id="qrcode-t${i}"></div>
            <a href="${tableUrl}" target="_blank" style="color:#38bdf8; font-size:0.9rem; word-break:break-all;">Lien direct Table ${i}</a>
          `;
          container.appendChild(card);

          new QRCode(document.getElementById(`qrcode-t${i}`), {
            text: tableUrl,
            width: 140,
            height: 140
          });
        }
      }

      document.getElementById('btn-gen-qr').onclick = generateQRCodes;
      generateQRCodes();
    }

    /* =========================================================
       2. VUE IPAD TABLE (INTERFACE ÉLÈVES)
       ========================================================= */
    function initTableUI() {
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
        <div class="container">
          <h2>🏓 Table ${tableId} — Saisie du Défi</h2>
          <div class="card">
            <label>Joueur A :</label>
            <select id="p1-select"><option value="">-- Sélectionner un joueur --</option></select>
            
            <label style="margin-top:15px; display:block;">Joueur B :</label>
            <select id="p2-select"><option value="">-- Sélectionner un joueur --</option></select>
          </div>

          <div class="card" id="match-actions" style="display:none;">
            <h3>Désigner le Vainqueur (Match en 11 pts)</h3>
            <button class="btn btn-success" id="btn-p1-win"></button>
            <button class="btn btn-success" id="btn-p2-win"></button>
          </div>
        </div>
      `;

      let players = {};
      let playedMatches = [];

      onValue(ref(db, 'players'), (snap) => {
        players = snap.val() || {};
        updatePlayerDropdowns(players);
      });

      onValue(ref(db, 'history'), (snap) => {
        playedMatches = Object.entries(snap.val() || {}).map(([key, val]) => ({ id: key, ...val }));
      });

      function updatePlayerDropdowns(playersData) {
        const p1 = document.getElementById('p1-select');
        const p2 = document.getElementById('p2-select');
        const options = Object.keys(playersData).map(id => `<option value="${id}">${playersData[id].name} (${playersData[id].points} pts)</option>`).join('');
        p1.innerHTML = '<option value="">-- Sélectionner le Joueur 1 --</option>' + options;
        p2.innerHTML = '<option value="">-- Sélectionner le Joueur 2 --</option>' + options;
      }

      document.addEventListener('change', () => {
        const id1 = document.getElementById('p1-select').value;
        const id2 = document.getElementById('p2-select').value;
        const actions = document.getElementById('match-actions');

        if (id1 && id2 && id1 !== id2) {
          // Règle EPS : Un seul défi entre deux mêmes personnes par séance
          const alreadyPlayed = playedMatches.some(m => 
            (m.winnerId === id1 && m.loserId === id2) || (m.winnerId === id2 && m.loserId === id1)
          );

          if (alreadyPlayed) {
            alert("⚠️ Vous avez déjà défié ce joueur pendant cette séance !");
            actions.style.display = "none";
            return;
          }

          document.getElementById('btn-p1-win').textContent = `Victoire de ${players[id1].name}`;
          document.getElementById('btn-p2-win').textContent = `Victoire de ${players[id2].name}`;
          actions.style.display = "block";
        } else {
          actions.style.display = "none";
        }
      });

      async function recordMatch(winnerId, loserId) {
        const w = players[winnerId];
        const l = players[loserId];

        const { gainWinner, lossLoser } = calculatePointsDelta(w.points, l.points);

        // Mises à jour dans la BDD
        await set(ref(db, `players/${winnerId}/points`), w.points + gainWinner);
        await set(ref(db, `players/${loserId}/points`), l.points + lossLoser);
        await set(ref(db, `players/${winnerId}/matches`), (w.matches || 0) + 1);
        await set(ref(db, `players/${loserId}/matches`), (l.matches || 0) + 1);

        // Historique avec points exacts pour permettre l'annulation
        await push(ref(db, 'history'), {
          table: tableId,
          winnerId,
          loserId,
          winnerName: w.name,
          loserName: l.name,
          gainWinner,
          lossLoser,
          timestamp: Date.now()
        });

        alert(`Match enregistré !\n${w.name} : +${gainWinner} pts\n${l.name} : ${lossLoser} pts`);
        location.reload();
      }

      document.getElementById('app').addEventListener('click', (e) => {
        const id1 = document.getElementById('p1-select').value;
        const id2 = document.getElementById('p2-select').value;
        if (e.target.id === 'btn-p1-win') recordMatch(id1, id2);
        if (e.target.id === 'btn-p2-win') recordMatch(id2, id1);
      });
    }

    /* =========================================================
       3. VUE IPAD PROFESSEUR (GESTION & CHRONOMÈTRE)
       ========================================================= */
    function initProfUI() {
      const baseUrl = window.location.origin + window.location.pathname;
      const appDiv = document.getElementById('app');
      appDiv.innerHTML = `
        <div class="container">
          <h1>📊 Supervision Professeur</h1>
          
          <div class="nav-tabs">
            <div class="tab-btn active" onclick="switchTab('ranking')">Classement</div>
            <div class="tab-btn" onclick="switchTab('history')">Historique & Corrections</div>
            <div class="tab-btn" onclick="switchTab('setup')">Gestion ÉLèves</div>
            <a href="${baseUrl}?role=hub" target="_blank" class="tab-btn" style="text-decoration:none;">📱 Hub QR Codes</a>
          </div>

          <!-- Tab 1: Timer + Classement -->
          <div id="tab-ranking">
            <div class="card">
              <h3>⏱️ Chronomètre de Rotation</h3>
              <div class="timer-display" id="timer-val">10:00</div>
              <div class="timer-controls">
                <button class="btn btn-success" id="btn-timer-start">Démarrer</button>
                <button class="btn btn-warning" id="btn-timer-pause">Pause</button>
                <button class="btn btn-danger" id="btn-timer-reset">RAZ (10 min)</button>
              </div>
            </div>

            <div class="card">
              <h3>Classement en Direct</h3>
              <table>
                <thead>
                  <tr>
                    <th>Rang</th>
                    <th>Nom Prénom</th>
                    <th>Points</th>
                    <th>Matchs Joués</th>
                  </tr>
                </thead>
                <tbody id="ranking-body"></tbody>
              </table>
            </div>
          </div>

          <!-- Tab 2: Historique & Annulation -->
          <div id="tab-history" style="display:none;">
            <div class="card">
              <h3>Flux des Matchs et Correction</h3>
              <table>
                <thead>
                  <tr>
                    <th>Table</th>
                    <th>Vainqueur</th>
                    <th>Perdant</th>
                    <th>Écart Pts</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="history-body"></tbody>
              </table>
            </div>
          </div>

          <!-- Tab 3: Configuration de Classe -->
          <div id="tab-setup" style="display:none;">
            <div class="card">
              <h3>Initialiser une Nouvelle Classe</h3>
              <p style="font-size:0.9rem; color:#94a3b8;">Collez la liste de vos élèves (un nom par ligne). Le 1er aura 100 pts, le 2e 99 pts, etc.</p>
              <textarea id="import-names" rows="6" placeholder="Eleve 1&#10;Eleve 2&#10;Eleve 3"></textarea>
              <button class="btn btn-success" id="btn-init-class">Initialiser la Classe (Capital 100, 99...)</button>
            </div>
          </div>
        </div>
      `;

      // Gestion des Onglets
      window.switchTab = (tab) => {
        document.getElementById('tab-ranking').style.display = tab === 'ranking' ? 'block' : 'none';
        document.getElementById('tab-history').style.display = tab === 'history' ? 'block' : 'none';
        document.getElementById('tab-setup').style.display = tab === 'setup' ? 'block' : 'none';
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
      };

      // 1. Live Ranking
      onValue(ref(db, 'players'), (snap) => {
        const players = snap.val() || {};
        const sorted = Object.values(players).sort((a, b) => b.points - a.points);

        const tbody = document.getElementById('ranking-body');
        tbody.innerHTML = sorted.map((p, index) => `
          <tr>
            <td><strong>${index + 1}</strong></td>
            <td>${p.name}</td>
            <td><span class="badge badge-win">${p.points} pts</span></td>
            <td>${p.matches || 0}</td>
          </tr>
        `).join('');
      });

      // 2. Historique & Annulation de Match
      let playersData = {};
      onValue(ref(db, 'players'), (snap) => playersData = snap.val() || {});

      onValue(ref(db, 'history'), (snap) => {
        const history = snap.val() || {};
        const tbody = document.getElementById('history-body');
        const entries = Object.entries(history).reverse();

        tbody.innerHTML = entries.map(([matchKey, m]) => `
          <tr>
            <td>Table ${m.table}</td>
            <td><strong>${m.winnerName}</strong> (+${m.gainWinner})</td>
            <td>${m.loserName} (${m.lossLoser})</td>
            <td>+${m.gainWinner - 1} / ${m.lossLoser - 1}</td>
            <td>
              <button class="btn-danger" onclick="cancelMatch('${matchKey}', '${m.winnerId}', '${m.loserId}', ${m.gainWinner}, ${m.lossLoser})">
                Annuler
              </button>
            </td>
          </tr>
        `).join('');
      });

      window.cancelMatch = async (matchKey, wId, lId, gainW, lossL) => {
        if (confirm("Annuler ce match et rétablir les points d'origine des élèves ?")) {
          const w = playersData[wId];
          const l = playersData[lId];

          if (w) {
            await set(ref(db, `players/${wId}/points`), w.points - gainW);
            await set(ref(db, `players/${wId}/matches`), Math.max(0, (w.matches || 1) - 1));
          }
          if (l) {
            await set(ref(db, `players/${lId}/points`), l.points - lossL);
            await set(ref(db, `players/${lId}/matches`), Math.max(0, (l.matches || 1) - 1));
          }

          await remove(ref(db, `history/${matchKey}`));
          alert("Match annulé et points réajustés !");
        }
      };

      // 3. Initialisation de Classe
      document.getElementById('btn-init-class').onclick = async () => {
        const names = document.getElementById('import-names').value.split('\n').filter(n => n.trim() !== '');
        if (names.length === 0) return alert("Veuillez saisir au moins un nom.");

        if (confirm("Attention : cela va réinitialiser le classement et l'historique actuel !")) {
          let startPoints = 100;
          const newPlayers = {};
          names.forEach((name, idx) => {
            const id = `p_${idx + 1}`;
            newPlayers[id] = { name: name.trim(), points: startPoints--, matches: 0 };
          });

          await set(ref(db, 'players'), newPlayers);
          await remove(ref(db, 'history'));
          alert("Classe créée avec succès !");
          switchTab('ranking');
        }
      };

      // 4. Chronomètre
      let timerSeconds = 600;
      let timerInterval = null;

      function updateTimerDisplay() {
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('timer-val').textContent = `${m}:${s}`;
      }

      document.getElementById('btn-timer-start').onclick = () => {
        if (!timerInterval) {
          timerInterval = setInterval(() => {
            if (timerSeconds > 0) {
              timerSeconds--;
              updateTimerDisplay();
            } else {
              clearInterval(timerInterval);
              timerInterval = null;
              alert("🔔 Fin de la rotation ! Changement de table.");
            }
          }, 1000);
        }
      };

      document.getElementById('btn-timer-pause').onclick = () => {
        clearInterval(timerInterval);
        timerInterval = null;
      };

      document.getElementById('btn-timer-reset').onclick = () => {
        clearInterval(timerInterval);
        timerInterval = null;
        timerSeconds = 600;
        updateTimerDisplay();
      };
    }
  </script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
